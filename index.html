<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>モルディブ謎メイカー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main id="app">

    <!-- タイトル画面 -->
    <section id="screen-title" class="screen">
      <h1>モルディブ謎メイカー</h1>
      <p class="message">2枚の写真から10秒の動画を作ります。</p>
      <button data-goto="screen-upload">はじめる</button>
    </section>

    <!-- アップロード画面 -->
    <section id="screen-upload" class="screen">
      <h2>写真を2枚選ぶ</h2>

      <div class="slot">
        <label for="riddleInput">謎画像</label>
        <input type="file" id="riddleInput" accept="image/*">
        <div class="preview" id="riddlePreview"></div>
      </div>

      <div class="slot">
        <label for="answerInput">答え画像</label>
        <input type="file" id="answerInput" accept="image/*">
        <div class="preview" id="answerPreview"></div>
      </div>

      <p class="message" id="uploadStatus">2枚とも選んでください</p>

      <button data-goto="screen-title">もどる</button>
      <button id="toCropBtn" data-goto="screen-crop" disabled>つぎへ</button>
    </section>

        <!-- トリミング画面 -->
    <section id="screen-crop" class="screen">
      <h2>ズームの始点を決める</h2>
      <p class="hint">ドラッグで位置、スライダーかホイールで大きさを調整します。</p>

      <div class="crop-area">
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="zoom-control">
        <span class="zoom-end">縮小</span>
        <input type="range" id="zoomSlider" min="0" max="1" step="0.001" value="0">
        <span class="zoom-end">拡大</span>
        <span id="zoomLabel"></span>
      </div>

      <button data-goto="screen-upload">もどる</button>
      <button data-goto="screen-midpoint">つぎへ</button>
    </section>

    <!-- 中間地点の指定 -->
    <section id="screen-midpoint" class="screen">
      <h2>ズームの中間地点を決める</h2>
      <p class="hint">前半でここまで引きます。スライダーかホイールで調整します。</p>

      <div class="crop-area">
        <canvas id="midCanvas"></canvas>
      </div>

      <div class="zoom-control">
        <span class="zoom-end">始点</span>
        <input type="range" id="midSlider" min="0" max="1" step="0.001" value="0.5">
        <span class="zoom-end">全体</span>
        <span id="midLabel"></span>
      </div>

      <button data-goto="screen-crop">もどる</button>
      <button data-goto="screen-result">動画を作る</button>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen">
      <h2>できあがり</h2>

      <p class="message" id="encodeStatus">準備中…</p>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p class="hint" id="encodeLog"></p>

      <div id="resultArea"></div>

      <button data-goto="screen-crop">もどる</button>
      <button data-goto="screen-upload">もう一度作る</button>
      <button data-goto="screen-title">タイトルへ</button>
    </section>

  </main>

  <script type="module" src="js/main.js"></script>

</body>
</html>
